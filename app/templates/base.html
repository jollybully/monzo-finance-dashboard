<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Finance{% endblock %} · Finance Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/">Finance</a>
      <nav class="nav">
        <a href="/" class="{{ 'active' if active == 'overview' else '' }}">Overview</a>
        <a href="/spending" class="{{ 'active' if active == 'spending' else '' }}">Spending</a>
        <a href="/bills" class="{{ 'active' if active == 'bills' else '' }}">Bills</a>
        <a href="/forecast" class="{{ 'active' if active == 'forecast' else '' }}">Forecast</a>
        <a href="/budgets" class="{{ 'active' if active == 'budgets' else '' }}">Budgets</a>
        <a href="/reports" class="{{ 'active' if active == 'reports' else '' }}">Reports</a>
        <a href="/settings" class="{{ 'active' if active == 'settings' else '' }}">Settings</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
