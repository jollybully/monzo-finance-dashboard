services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 5s
      retries: 10
    # ports:
    #   - "5432:5432"
    restart: unless-stopped

  finance-app:
    build: .
    ports:
      - "18000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://finance:finance@postgres:5432/finance
    volumes:
      - ./credentials:/credentials:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
